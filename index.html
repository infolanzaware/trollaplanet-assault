<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>TrollaPlanet Assault</title>
<style>
body { margin:0; background:#000; color:#0f0; font-family: 'Courier New', monospace; overflow:hidden; }
canvas { display:block; background:#000; cursor:crosshair; }
#ui { position:absolute; top:10px; left:10px; font-size:16px; pointer-events:none; text-shadow:0 0 5px #0f0; }
#title { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; font-size:32px; display:none; }
#title h1 { margin:0; font-size:48px; color:#fff; text-shadow:0 0 10px #0ff; }
#title p { font-size:18px; }
button { background:#000; color:#0f0; border:2px solid #0f0; padding:10px 20px; font-family:inherit; font-size:20px; cursor:pointer; margin:10px; }
button:hover { background:#0f0; color:#000; }
#gameover { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>SCORE: <span id="score">0</span></div>
  <div>SHIELDS: <span id="shields">5</span></div>
  <div>PHASE: <span id="phase">SPACE</span></div>
  <div>WAVE: <span id="wave">1</span></div>
</div>
<div id="title">
  <h1>TROLLAPLANET ASSAULT</h1>
  <p>Distruggi i troll di internet e i satelliti spia<br>per salvare TrollaPlanet!</p>
  <p>Muovi il mouse per mirare • Click o SPACE per sparare</p>
  <p>Su mobile: trascina per mirare, tocca per sparare</p>
  <button id="startBtn">INIZIA ASSALTO</button>
</div>
<div id="gameover">
  <h1>GAME OVER</h1>
  <p id="finalScore"></p>
  <button id="restartBtn">RIPROVA</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const title = document.getElementById('title');
const gameover = document.getElementById('gameover');
const scoreEl = document.getElementById('score');
const shieldsEl = document.getElementById('shields');
const phaseEl = document.getElementById('phase');
const waveEl = document.getElementById('wave');

let gameState = 'title';
let score = 0;
let shields = 5;
let wave = 1;
let phase = 'SPACE';
let mouseX = 0, mouseY = 0;
let shooting = false;
let lastShot = 0;
const shotCooldown = 150;

const stars = [];
for(let i=0; i<200; i++) stars.push({x:Math.random()*2000-1000, y:Math.random()*2000-1000, z:Math.random()*1000+100, speed:2+Math.random()*3});

const enemies = [];
const projectiles = [];
const particles = [];

function spawnEnemy(type) {
  const z = 800 + Math.random()*400;
  enemies.push({
    type,
    x: (Math.random()-0.5)*800,
    y: (Math.random()-0.5)*400,
    z,
    vx: (Math.random()-0.5)*2,
    vy: (Math.random()-0.5)*1,
    vz: - (4 + wave*0.5 + Math.random()*2),
    size: type==='satellite' ? 40 : 30,
    hp: type==='troll' ? 1 : 2,
    color: type==='troll' ? '#0f0' : type==='satellite' ? '#f00' : '#ff0'
  });
}

function spawnWave() {
  const count = 4 + wave*2;
  for(let i=0; i<count; i++) {
    const types = phase==='SPACE' ? ['troll','satellite'] : ['troll','turret'];
    spawnEnemy(types[Math.floor(Math.random()*types.length)]);
  }
}

function project(x,y,z) {
  const scale = 400 / (z || 1);
  return {x: W/2 + x*scale, y: H/2 + y*scale, s: scale};
}

function drawWireframe(obj) {
  const p = project(obj.x, obj.y, obj.z);
  if(p.s < 0.1) return;
  ctx.strokeStyle = obj.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const s = obj.size * p.s;
  if(obj.type === 'troll') {
    ctx.moveTo(p.x - s, p.y);
    ctx.lineTo(p.x - s*0.5, p.y - s);
    ctx.lineTo(p.x + s*0.5, p.y - s);
    ctx.lineTo(p.x + s, p.y);
    ctx.lineTo(p.x + s*0.3, p.y + s*0.5);
    ctx.lineTo(p.x - s*0.3, p.y + s*0.5);
    ctx.closePath();
    ctx.moveTo(p.x - s*0.6, p.y - s*0.8);
    ctx.lineTo(p.x - s*0.8, p.y - s*1.4);
    ctx.moveTo(p.x + s*0.6, p.y - s*0.8);
    ctx.lineTo(p.x + s*0.8, p.y - s*1.4);
  } else if(obj.type === 'satellite') {
    ctx.rect(p.x - s*0.6, p.y - s*0.4, s*1.2, s*0.8);
    ctx.moveTo(p.x - s, p.y);
    ctx.lineTo(p.x - s*1.8, p.y);
    ctx.moveTo(p.x + s, p.y);
    ctx.lineTo(p.x + s*1.8, p.y);
    ctx.moveTo(p.x, p.y - s*0.5);
    ctx.lineTo(p.x, p.y - s*1.2);
  } else {
    ctx.moveTo(p.x, p.y - s);
    ctx.lineTo(p.x - s*0.4, p.y + s*0.5);
    ctx.lineTo(p.x + s*0.4, p.y + s*0.5);
    ctx.closePath();
  }
  ctx.stroke();
}

function drawShip() {
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const cx = W/2, cy = H*0.75;
  ctx.moveTo(cx - 40, cy);
  ctx.lineTo(cx - 10, cy - 20);
  ctx.lineTo(cx + 10, cy - 20);
  ctx.lineTo(cx + 40, cy);
  ctx.lineTo(cx + 15, cy + 10);
  ctx.lineTo(cx - 15, cy + 10);
  ctx.closePath();
  ctx.moveTo(cx - 30, cy - 5);
  ctx.lineTo(cx - 60, cy - 30);
  ctx.moveTo(cx + 30, cy - 5);
  ctx.lineTo(cx + 60, cy - 30);
  ctx.stroke();
}

function update() {
  if(gameState !== 'playing') return;
  for(let s of stars) {
    s.z -= s.speed;
    if(s.z < 1) { s.z = 1000; s.x = (Math.random()-0.5)*2000; s.y = (Math.random()-0.5)*2000; }
  }
  for(let i = enemies.length-1; i>=0; i--) {
    const e = enemies[i];
    e.x += e.vx;
    e.y += e.vy;
    e.z += e.vz;
    if(e.z < 50) {
      shields--;
      shieldsEl.textContent = shields;
      enemies.splice(i,1);
      if(shields <= 0) endGame();
      continue;
    }
    if(Math.random() < 0.01 && e.z < 600) {
      projectiles.push({
        x: e.x, y: e.y, z: e.z,
        vx: (0 - e.x)*0.01, vy: (0 - e.y)*0.01, vz: 8,
        fromEnemy: true, color: '#f00'
      });
    }
  }
  for(let i = projectiles.length-1; i>=0; i--) {
    const p = projectiles[i];
    p.x += p.vx || 0;
    p.y += p.vy || 0;
    p.z += p.vz;
    if(p.fromEnemy && p.z < 80) {
      shields--;
      shieldsEl.textContent = shields;
      projectiles.splice(i,1);
      if(shields <= 0) endGame();
      continue;
    }
    if(p.z > 1200 || p.z < 0) { projectiles.splice(i,1); continue; }
    if(!p.fromEnemy) {
      for(let j = enemies.length-1; j>=0; j--) {
        const e = enemies[j];
        const dx = p.x - e.x, dy = p.y - e.y, dz = p.z - e.z;
        if(Math.abs(dx)<e.size && Math.abs(dy)<e.size && Math.abs(dz)<40) {
          e.hp--;
          projectiles.splice(i,1);
          if(e.hp <= 0) {
            score += e.type==='troll' ? 100 : 150;
            scoreEl.textContent = score;
            enemies.splice(j,1);
            for(let k=0;k<8;k++) particles.push({x:e.x,y:e.y,z:e.z, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, vz:(Math.random()-0.5)*5, life:30, color:e.color});
          }
          break;
        }
      }
    }
  }
  for(let i=particles.length-1;i>=0;i--) {
    const pt = particles[i];
    pt.x += pt.vx||0; pt.y += pt.vy||0; pt.z += pt.vz||0;
    pt.life--;
    if(pt.life<=0) particles.splice(i,1);
  }
  if(shooting && Date.now() - lastShot > shotCooldown) {
    const aimX = (mouseX - W/2) * 0.5;
    const aimY = (mouseY - H/2) * 0.5;
    projectiles.push({
      x: aimX * 0.2, y: aimY * 0.2, z: 100,
      vx: aimX * 0.03, vy: aimY * 0.03, vz: 15,
      fromEnemy: false, color: '#0ff'
    });
    lastShot = Date.now();
  }
  if(enemies.length === 0) {
    wave++;
    waveEl.textContent = wave;
    if(wave % 3 === 0 && phase === 'SPACE') {
      phase = 'APPROACH';
      phaseEl.textContent = 'APPROACH TROLLAPLANET';
    } else if(phase === 'APPROACH' && wave % 2 === 0) {
      phase = 'TRENCH';
      phaseEl.textContent = 'TRENCH RUN';
    } else if(phase === 'TRENCH' && score > 2000) {
      phase = 'CORE';
      phaseEl.textContent = 'DESTROY CORE';
      enemies.push({type:'core', x:0, y:0, z:600, vx:0, vy:0, vz:-2, size:60, hp:10, color:'#f0f'});
    }
    if(phase !== 'CORE' || enemies.length === 0) spawnWave();
    if(phase === 'CORE' && enemies.length === 0) {
      score += 5000;
      scoreEl.textContent = score;
      setTimeout(() => { alert('TROLLAPLANET SALVATO! I troll sono stati sconfitti!'); endGame(); }, 500);
    }
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  for(let s of stars) {
    const p = project(s.x, s.y, s.z);
    if(p.s > 0) {
      ctx.globalAlpha = Math.min(1, p.s*2);
      ctx.fillRect(p.x, p.y, Math.max(1, p.s*2), Math.max(1, p.s*2));
    }
  }
  ctx.globalAlpha = 1;
  if(phase !== 'SPACE') {
    ctx.strokeStyle = '#00f';
    ctx.lineWidth = 1;
    const pz = phase==='APPROACH' ? 1500 - (wave%3)*100 : 2000;
    const p = project(0, 200, pz);
    if(p.s > 0.05) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 200*p.s, 0, Math.PI*2);
      ctx.stroke();
      for(let i=-3;i<=3;i++) {
        ctx.beginPath();
        ctx.moveTo(p.x + i*40*p.s, p.y - 150*p.s);
        ctx.lineTo(p.x + i*40*p.s, p.y + 150*p.s);
        ctx.stroke();
      }
    }
  }
  enemies.sort((a,b)=>b.z-a.z);
  for(let e of enemies) drawWireframe(e);
  for(let p of projectiles) {
    const pr = project(p.x, p.y, p.z);
    ctx.fillStyle = p.color;
    ctx.fillRect(pr.x-2, pr.y-2, 4, 4);
    ctx.strokeStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(pr.x, pr.y);
    const trail = project(p.x, p.y, p.z+30);
    ctx.lineTo(trail.x, trail.y);
    ctx.stroke();
  }
  for(let pt of particles) {
    const pr = project(pt.x, pt.y, pt.z);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.life/30;
    ctx.fillRect(pr.x, pr.y, 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 15, 0, Math.PI*2);
  ctx.moveTo(mouseX-20, mouseY);
  ctx.lineTo(mouseX+20, mouseY);
  ctx.moveTo(mouseX, mouseY-20);
  ctx.lineTo(mouseX, mouseY+20);
  ctx.stroke();
  drawShip();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

function startGame() {
  gameState = 'playing';
  title.style.display = 'none';
  gameover.style.display = 'none';
  score = 0; shields = 5; wave = 1; phase = 'SPACE';
  scoreEl.textContent = 0;
  shieldsEl.textContent = 5;
  phaseEl.textContent = 'SPACE';
  waveEl.textContent = 1;
  enemies.length = 0;
  projectiles.length = 0;
  particles.length = 0;
  spawnWave();
}

function endGame() {
  gameState = 'gameover';
  document.getElementById('finalScore').textContent = 'Punteggio finale: ' + score;
  gameover.style.display = 'block';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', () => shooting = true);
canvas.addEventListener('mouseup', () => shooting = false);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  shooting = true;
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX; mouseY = t.clientY;
}, {passive:false});
canvas.addEventListener('touchend', () => shooting = false);
document.addEventListener('keydown', e => { if(e.code==='Space') shooting = true; });
document.addEventListener('keyup', e => { if(e.code==='Space') shooting = false; });

title.style.display = 'block';
</script>
</body>
</html>
